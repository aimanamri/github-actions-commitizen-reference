# CI: run tests on every pull request to main, plus a commit-message check.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Quote versions: unquoted 3.10 is parsed by YAML as the float 3.1
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: pytest -v

  commit-lint:
    name: Conventional commit check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history needed to compare against the base branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install commitizen
      - name: Check every commit in the PR
        env:
          BASE_REF: ${{ github.base_ref }} # via env, never inline ${{ }} inside run:
        run: cz check --rev-range "origin/$BASE_REF..HEAD"
